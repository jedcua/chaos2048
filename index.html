<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chaos 2048</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app">

  <!-- ============ Main menu ============ -->
  <section id="menu" class="screen">
    <h1 class="logo"><span class="cl c1">C</span><span class="cl c2">h</span><span class="cl c3">a</span><span class="cl c4">o</span><span class="cl c5">s</span> 2048</h1>
    <p class="tagline">Join the tiles, get to the 2048 tile!</p>
    <button id="playBtn" class="btn primary">Play</button>

    <div class="card">
      <h2>Top 5 High Scores</h2>
      <ol id="hsList"></ol>
    </div>

    <div class="card accordion">
      <button id="chaosToggle" class="acc-header" aria-expanded="false" aria-controls="chaosBody">
        <span class="acc-title">Settings</span>
        <span class="acc-chevron" aria-hidden="true">▾</span>
      </button>
      <div id="chaosBody" class="acc-body hidden">
        <div class="chaos-controls">
          <p class="desc chaos-desc">Every so often, chaos strikes. Set the interval and odds:</p>
          <button id="chaosMinus" class="btn small">&minus;</button>
          <span class="chaos-value" id="chaosValue">3s</span>
          <button id="chaosPlus" class="btn small">+</button>
        </div>
        <!-- One row per chaos event type; built by buildChaosRows() from CHAOS_TYPES -->
        <div id="probRows"></div>
        <button id="chaosReset" class="btn small chaos-reset">Reset to default</button>
      </div>
    </div>

    <p class="hint">Use the arrow keys to move tiles.</p>

    <footer class="menu-footer">Made by Jed</footer>
  </section>

  <!-- ============ Game ============ -->
  <section id="game" class="screen hidden">
    <div class="game-header">
      <div class="actions">
        <button id="newGameBtn" class="btn">New Game</button>
        <button id="menuBtn" class="btn">Menu</button>
      </div>
      <div class="scores">
        <div class="score-box" id="scoreBox">
          <span class="label">Score</span><span class="value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="label">Best</span><span class="value" id="best">0</span>
        </div>
        <div class="score-box" id="chaosBox">
          <span class="label">Chaos</span><span class="value" id="chaosCount">&mdash;</span>
          <span class="next" id="chaosNext">&mdash;</span>
        </div>
      </div>
    </div>

    <div id="boardArea">
      <div id="boardWrap">
        <div id="boardRot">
          <div id="board"></div>
          <div id="gravityFx" class="hidden"><div id="gravityArrow"></div></div>
        </div>
        <div id="overlay" class="hidden">
          <div class="overlay-card">
            <h2 id="overlayTitle"></h2>
            <p id="overlayText"></p>
            <div class="row">
              <button id="overlayPrimary" class="btn primary"></button>
              <button id="overlaySecondary" class="btn"></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="hint">Arrow keys or swipe to move &middot; Esc for menu</p>
  </section>

</div>

<script src="js/state.js"></script>
<script src="js/board.js"></script>
<script src="js/chaos.js"></script>
<script src="js/game.js"></script>
<script src="js/selftest.js"></script>
</body>
</html>
